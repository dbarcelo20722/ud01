<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX3_2</title>

    <style>
        .red {
            color: red;
        }
    </style>
</head>

<body>
    <form action="">
        <h1>Formulario</h1>

        <div>
            <label for="entrada">Hora de entrada:</label>
            <input type="text" id="entrada" name="entrada" placeholder="HH:MM">
        </div>

        <div>
            <label for="salida">Hora de salida:</label>
            <input type="text" id="salida" name="salida" placeholder="HH:MM">
        </div>

        <div>
            <label for="descuento">Tipo de descuento</label>
            <select name="descuento" id="descuento">
                <option value="1">Sin descuento</option>
                <option value="2">Vehículo eléctrico</option>
                <option value="3">Residente</option>
            </select>
        </div>

        <p id="centrada" class="red"></p>
        <p id="csalida" class="red"></p>
    </form>

    <h1>RESUM DE L'ESTACIONAMENT</h1>

    <p id="resumen"></p>

    <script src="script.js"></script>
</body>

</html>
